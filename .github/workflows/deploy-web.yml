name: Validate and deploy web

on:
  pull_request:
    branches:
      - main
    paths:
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"
      - "apps/admin/**"
      - "apps/marketing/**"
      - "firebase.json"
      - "functions/**"
  push:
    branches:
      - main
    paths:
      - ".firebaserc"
      - ".github/workflows/deploy-web.yml"
      - "apps/admin/**"
      - "apps/marketing/**"
      - "firebase.json"
  workflow_dispatch:

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-deploy:
    name: Validate and deploy web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/marketing/package-lock.json
            functions/package-lock.json

      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Validate Functions
        working-directory: functions
        run: npm run lint && npm test

      - name: Install admin dependencies
        working-directory: apps/admin
        run: npm ci

      - name: Validate and build admin
        working-directory: apps/admin
        run: npm run verify

      - name: Install landing page dependencies
        working-directory: apps/marketing
        run: npm ci

      - name: Validate and build landing page
        working-directory: apps/marketing
        run: npm run verify

      - name: Require Firebase deployment credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Configure the FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB repository secret before deploying."
            exit 1
          fi

      - name: Deploy admin to Firebase Hosting
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB }}
          projectId: jdb-league-hub
          channelId: live
          target: admin
          firebaseToolsVersion: 15.27.0

      - name: Deploy landing page to Firebase Hosting
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB }}
          projectId: jdb-league-hub
          channelId: live
          target: marketing
          firebaseToolsVersion: 15.27.0
