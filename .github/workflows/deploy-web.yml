name: Validate and deploy Firebase

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - ".firebaserc"
      - ".github/workflows/deploy-functions.yml"
      - ".github/workflows/deploy-web.yml"
      - "apps/admin/**"
      - "apps/marketing/**"
      - "firebase.json"
      - "firebase.rules-test.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "functions/**"
      - "storage.rules"
  workflow_dispatch:

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  # Keep production releases serialized so a newer push cannot cancel a deploy
  # after only one Hosting target has been updated.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-plan:
    name: Plan Firebase release
    runs-on: ubuntu-latest
    outputs:
      functions_validate: ${{ steps.plan.outputs.functions_validate }}
      functions_deploy: ${{ steps.plan.outputs.functions_deploy }}
      functions_all: ${{ steps.plan.outputs.functions_all }}
      functions_targets: ${{ steps.plan.outputs.functions_targets }}
      rules_validate: ${{ steps.plan.outputs.rules_validate }}
      rules_deploy: ${{ steps.plan.outputs.rules_deploy }}
      admin_validate: ${{ steps.plan.outputs.admin_validate }}
      admin_deploy: ${{ steps.plan.outputs.admin_deploy }}
      marketing_validate: ${{ steps.plan.outputs.marketing_validate }}
      marketing_deploy: ${{ steps.plan.outputs.marketing_deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve affected release surfaces
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "functions_validate=true"
              echo "functions_deploy=true"
              echo "functions_all=true"
              echo "functions_targets="
              echo "rules_validate=true"
              echo "rules_deploy=true"
              echo "admin_validate=true"
              echo "admin_deploy=true"
              echo "marketing_validate=true"
              echo "marketing_deploy=true"
            } >> "$GITHUB_OUTPUT"
          else
            node functions/scripts/function-release.js plan \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA" \
              --output "$GITHUB_OUTPUT"
          fi

  functions:
    needs: release-plan
    if: needs.release-plan.outputs.functions_validate == 'true'
    uses: ./.github/workflows/deploy-functions.yml
    with:
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.release-plan.outputs.functions_deploy == 'true' }}
      targets: ${{ needs.release-plan.outputs.functions_targets }}
      all: ${{ needs.release-plan.outputs.functions_all == 'true' }}
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB }}

  rules:
    name: Validate and deploy rules and indexes
    needs: release-plan
    if: needs.release-plan.outputs.rules_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Set up Java 21 for Firebase emulators
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install rules test dependencies
        working-directory: functions
        run: npm ci

      - name: Build Functions dependencies used by rules tests
        working-directory: functions
        run: npm run build

      - name: Validate Firestore and Storage rules
        run: |
          npx --yes firebase-tools@15.27.0 emulators:exec \
            --config firebase.rules-test.json \
            --project demo-league-hub-rules \
            --only firestore,storage \
            "node --test functions/test/*.rules.js"

      - name: Configure Firebase credentials
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          needs.release-plan.outputs.rules_deploy == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Configure FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB before deploying rules and indexes."
            exit 1
          fi
          credentials_path="$RUNNER_TEMP/firebase-service-account.json"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_path"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules and indexes and Storage rules
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          needs.release-plan.outputs.rules_deploy == 'true'
        run: |
          npx --yes firebase-tools@15.27.0 deploy \
            --project jdb-league-hub \
            --only firestore,storage \
            --non-interactive

  validate-and-deploy:
    name: Validate and deploy web
    needs:
      - release-plan
      - functions
      - rules
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require successful release prerequisites
        env:
          PLAN_RESULT: ${{ needs.release-plan.result }}
          FUNCTIONS_RESULT: ${{ needs.functions.result }}
          RULES_RESULT: ${{ needs.rules.result }}
        run: |
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::Firebase release planning failed."
            exit 1
          fi
          if [ "$FUNCTIONS_RESULT" != "success" ] && [ "$FUNCTIONS_RESULT" != "skipped" ]; then
            echo "::error::Functions validation or deployment failed."
            exit 1
          fi
          if [ "$RULES_RESULT" != "success" ] && [ "$RULES_RESULT" != "skipped" ]; then
            echo "::error::Rules/index validation or deployment failed."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js 22
        if: needs.release-plan.outputs.admin_validate == 'true' || needs.release-plan.outputs.marketing_validate == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/admin/package-lock.json
            apps/marketing/package-lock.json
            functions/package-lock.json

      - name: Install admin dependencies
        if: needs.release-plan.outputs.admin_validate == 'true'
        working-directory: apps/admin
        run: npm ci

      - name: Validate and build admin
        if: needs.release-plan.outputs.admin_validate == 'true'
        working-directory: apps/admin
        run: npm run verify

      - name: Install landing page dependencies
        if: needs.release-plan.outputs.marketing_validate == 'true'
        working-directory: apps/marketing
        run: npm ci

      - name: Validate and build landing page
        if: needs.release-plan.outputs.marketing_validate == 'true'
        working-directory: apps/marketing
        run: npm run verify

      - name: Require Firebase deployment credentials
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          (needs.release-plan.outputs.admin_deploy == 'true' || needs.release-plan.outputs.marketing_deploy == 'true')
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Configure the FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB repository secret before deploying."
            exit 1
          fi

      - name: Deploy admin to Firebase Hosting
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          needs.release-plan.outputs.admin_deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB }}
          projectId: jdb-league-hub
          channelId: live
          target: admin
          firebaseToolsVersion: 15.27.0

      - name: Deploy landing page to Firebase Hosting
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          needs.release-plan.outputs.marketing_deploy == 'true'
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JDB_LEAGUE_HUB }}
          projectId: jdb-league-hub
          channelId: live
          target: marketing
          firebaseToolsVersion: 15.27.0
